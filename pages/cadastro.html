<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro - PetLar</title>
<link href="../css/cadastro.css" rel="stylesheet"/>
<link href="../css/perfis.css" rel="stylesheet"/><script defer="" src="../js/identidadeUI.js"></script><link href="../css/identidade.css" rel="stylesheet"/></head>
<body>
<div class="cadastro-container">
<div class="cadastro-card">
<h1>🐾 PetLar</h1>
<h2>Criar Conta</h2>
<p class="subtitulo">
                Cadastre-se para adotar animais e acompanhar suas adoções.
            </p>
<form id="formCadastro">
<!-- NOME -->
<div class="campo">
<label for="nome">Nome Completo</label>
<input id="nome" placeholder="Digite seu nome completo" type="text"/>
</div>
<!-- CPF E CEP -->
<div class="linha">
<div class="campo">
<label for="cpf">CPF</label>
<input id="cpf" maxlength="14" placeholder="000.000.000-00" type="text"/>
<small class="erro" id="erroCpf"></small>
</div>
<div class="campo">
<label for="cep">CEP</label>
<input id="cep" maxlength="9" placeholder="00000-000" type="text"/>
<small class="erro" id="erroCep"></small>
</div>
</div>
<!-- RUA -->
<div class="campo">
<label for="rua">Rua</label>
<input id="rua" readonly="" type="text"/>
</div>
<!-- BAIRRO -->
<div class="campo">
<label for="bairro"> Bairro</label>
<input id="bairro" readonly="" type="text"/>
</div>
<!-- CIDADE E ESTADO -->
<div class="linha">
<div class="campo">
<label for="cidade">Cidade</label>
<input id="cidade" readonly="" type="text"/>
</div>
<div class="campo">
<label for="estado">Estado</label>
<input id="estado" readonly="" type="text"/>
</div>
</div>
<!-- COMPLEMENTO E NÚMERO -->
<div class="linha">
<div class="campo">
<label for="complemento">Complemento</label>
<input id="complemento" placeholder="Apto, Casa, etc." type="text"/>
</div>
<div class="campo">
<label for="numero">Número</label>
<input id="numero" placeholder="Número da residência" type="text"/>
</div>
</div>
<!-- TELEFONE E EMAIL -->
<div class="linha">
<div class="campo">
<label for="telefone">Telefone</label>
<input id="telefone" placeholder="(00) 00000-0000" type="tel"/>
</div>
<div class="campo">
<label for="email">E-mail</label>
<input id="email" placeholder="seuemail@email.com" type="email"/>
</div>
</div>
<!-- SENHAS -->
<div class="linha">
<div class="campo">
<label for="senha">Senha</label>
<input id="senha" placeholder="Digite sua senha" type="password"/></div>
<div class="campo">
<label for="confirmarSenha">Confirmar Senha</label>
<input id="confirmarSenha" placeholder="Confirme sua senha" type="password"/>
</div>
</div>
<!-- MENSAGEM -->
<p class="mensagem" id="mensagemCadastro"></p>
<!-- BOTÃO -->
<button type="submit"> Criar Conta</button>
</form>
<p class="subtitulo">Já possui uma conta? <a href="login.html">Faça login por aqui</a></p>
<br/><br/><br/><br/>
<!-- VOLTAR -->
<div class="voltar">
<a href="../index.html"> ← Voltar para o PetLar</a>
</div>
</div>
</div>
<script src="../js/validaCadastro.js"></script>
</body>
</html>
